<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fbf4e7"><title>Soft Serve – Cone Challenge</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#faf3e6;font-family:system-ui,-apple-system,sans-serif;color:#344943}canvas{display:block;width:100%;height:100%;touch-action:none}#top{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;font-size:11px;opacity:.68;pointer-events:none}#height{position:absolute;right:20px;top:59%;font-size:clamp(18px,5vw,26px);font-weight:600;pointer-events:none}#instructions{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13px);left:0;right:0;text-align:center;font-size:12px;opacity:.73;pointer-events:none}.toolbar{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 25px);left:14px;display:flex;gap:7px}button{border:0;background:#f8f6ebdd;color:#2e5049;border-radius:20px;padding:10px 14px;cursor:pointer;font-weight:700;box-shadow:0 1px 6px #3331}.overlay{position:absolute;inset:0;display:none;place-items:center;background:#fff6e8aa;backdrop-filter:blur(2px)}.overlay.show{display:grid}.modal{min-width:min(85vw,340px);padding:24px;text-align:center;background:#fffaf0;border-radius:20px;box-shadow:0 15px 60px #64583b29}.modal h2{margin:0 0 8px;font-size:18px;font-weight:500}.score{font-size:52px;margin:5px;font-weight:600}.stars{font-size:25px;color:#b2a893;margin-bottom:20px;letter-spacing:8px}.again{background:#2e594d;color:white;width:100%;padding:14px}
</style></head><body><canvas id="game"></canvas><div id="top"><span>クリアリセット · Soft Serve</span><span>v1.1 · Cone Challenge</span></div><div id="height">0.0 cm</div><div class="toolbar"><button id="sound" title="الصوت">♫</button><button id="reset" title="إعادة">↻</button></div><div id="instructions">حرّك المؤشر داخل الدائرة لبدء الصب تلقائيًا</div><div class="overlay" id="overlay"><div class="modal"><h2>انتهت المحاولة 🍦</h2><div class="score" id="finalScore">0.0</div><div>cm</div><div class="stars" id="stars">☆☆☆☆☆</div><p id="message">جرب مجددًا!</p><button class="again" id="again">إعادة اللعب ↻</button></div></div><script>
(()=>{'use strict';const C=document.getElementById('game'),g=C.getContext('2d'),$=s=>document.querySelector(s),TAU=Math.PI*2;let W,H,dpr,now=0,last=0,mode='ready',start=0,cur={x:0,y:0},target={x:0,y:0},drag=false,pid=null,cream=[],height=0,fallT=0,tilt=0,sound=true,ac=null,nextDot=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=(a,b,k)=>a+(b-a)*k;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);C.width=Math.round(W*dpr);C.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function play(f=400){if(!sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;o.type='sine';v.gain.setValueAtTime(.017,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.075);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.075)}catch{}}
function scene(){const scale=Math.min(W/390,H/760),coneX=W/2+cur.x*scale*62,coneY=H*.43+cur.y*scale*24,nozzleY=H*.085,controlY=H*.81;return{scale,coneX,coneY,nozzleY,controlY}}
function reset(){mode='ready';start=0;cream=[];height=0;fallT=0;cur={x:0,y:0};target={x:0,y:0};tilt=0;$('#height').textContent='0.0 cm';$('#overlay').classList.remove('show');$('#instructions').style.opacity='0.73';nextDot=0}function stop(){if(mode==='over')return;mode='fall';fallT=0;play(170)}function finish(){mode='over';$('#finalScore').textContent=height.toFixed(1);let stars=height>=18?2:height>=12?3:height>=7?4:5;$('#stars').textContent='★'.repeat(stars)+'☆'.repeat(5-stars);$('#message').textContent=height>17?'طوّلت البرج لين اختل توازنه!':'حاول تلف الآيسكريم بتوازن أكثر';$('#overlay').classList.add('show')}
function targetFromPoint(x,y){const s=scene(),radius=64*s.scale;target.x=clamp((x-W/2)/radius,-1.35,1.35);target.y=clamp((y-s.controlY)/radius,-1.35,1.35)}C.addEventListener('pointerdown',e=>{if(mode==='over'||mode==='fall')return;pid=e.pointerId;drag=true;C.setPointerCapture(pid);targetFromPoint(e.clientX,e.clientY);if(mode==='ready'){mode='pour';start=now;play(460);$('#instructions').style.opacity='0'}});C.addEventListener('pointermove',e=>{if(drag&&pid===e.pointerId)targetFromPoint(e.clientX,e.clientY)});function end(e){if(e.pointerId===pid){drag=false;pid=null;target={x:cur.x,y:cur.y}}}C.addEventListener('pointerup',end);C.addEventListener('pointercancel',end);$('#reset').onclick=()=>{reset();play(480)};$('#again').onclick=()=>{reset();play(480)};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'♫':'♪̸'};addEventListener('keydown',e=>{if(e.code==='ArrowLeft')target.x-=.13;if(e.code==='ArrowRight')target.x+=.13;if(e.code==='ArrowUp')target.y-=.13;if(e.code==='ArrowDown')target.y+=.13;if(mode==='ready'&&e.code.startsWith('Arrow')){mode='pour';start=now}});
function ellipse(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill()}function polygon(points,fill){g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();g.fillStyle=fill;g.fill()}function linePath(points,col,width){if(points.length<2)return;g.strokeStyle=col;g.lineWidth=width;g.lineJoin='round';g.lineCap='round';g.beginPath();g.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length-1;i++){let mid={x:(points[i].x+points[i+1].x)/2,y:(points[i].y+points[i+1].y)/2};g.quadraticCurveTo(points[i].x,points[i].y,mid.x,mid.y)}let p=points[points.length-1];g.lineTo(p.x,p.y);g.stroke()}
function paint(){let s=scene(),sc=s.scale,cx=s.coneX,cy=s.coneY,sy=s.nozzleY;g.fillStyle='#faf3e6';g.fillRect(0,0,W,H); // minimal original-inspired backdrop
// lower pale green touch pad
const padTop=H*.685;g.fillStyle='#e3e9d8';g.beginPath();g.moveTo(14,padTop);g.lineTo(W-14,padTop);g.quadraticCurveTo(W,padTop,W,padTop+14);g.lineTo(W,H*.915);g.lineTo(0,H*.915);g.lineTo(0,padTop+14);g.quadraticCurveTo(0,padTop,14,padTop);g.fill();g.strokeStyle='#bdcaba';g.lineWidth=1;g.setLineDash([2,3]);g.beginPath();g.arc(W/2,s.controlY,58*sc,0,TAU);g.stroke();g.setLineDash([]);ellipse(W/2,s.controlY,2.2*sc,2.2*sc,'#81968c');ellipse(W/2+target.x*48*sc,s.controlY+target.y*48*sc,7*sc,7*sc,'#afc5b7');ellipse(W/2+target.x*48*sc,s.controlY+target.y*48*sc,3.4*sc,3.4*sc,'#668c7b');
// dispenser narrow overhead nozzle
const left=W/2-8.7*sc;let metal=g.createLinearGradient(left,0,left+18*sc,0);metal.addColorStop(0,'#354b47');metal.addColorStop(.5,'#58746d');metal.addColorStop(1,'#2a3d39');g.fillStyle=metal;g.fillRect(left,-2,17.4*sc,sy+13*sc);ellipse(W/2,sy+14*sc,17*sc,10*sc,'#385750');g.fillStyle='#527168';g.fillRect(W/2-18*sc,sy+3*sc,36*sc,17*sc);ellipse(W/2,sy+4*sc,18*sc,7*sc,'#617e75');ellipse(W/2,sy+21*sc,13*sc,6*sc,'#3b514b');
// cone (top grows up with pile by moving whole scene with height; nozzle stays fixed)
let top=cy+52*sc,tip=cy+143*sc;g.save();if(mode==='fall'||mode==='over'){g.translate(cx,top);g.rotate(tilt);g.translate(-cx,-top)}let waffle=g.createLinearGradient(cx-31*sc,0,cx+31*sc,0);waffle.addColorStop(0,'#9c5b2b');waffle.addColorStop(.45,'#d99a55');waffle.addColorStop(1,'#af6a2e');g.beginPath();g.moveTo(cx-33*sc,top);g.quadraticCurveTo(cx,top+9*sc,cx+33*sc,top);g.lineTo(cx,tip);g.closePath();g.fillStyle=waffle;g.fill();g.save();g.clip();g.strokeStyle='#8e5a2d88';g.lineWidth=1.2*sc;for(let i=-180;i<180;i+=9){g.beginPath();g.moveTo(cx+i*sc,top-16*sc);g.lineTo(cx+(i+120)*sc,tip+15*sc);g.stroke();g.beginPath();g.moveTo(cx+i*sc,tip+15*sc);g.lineTo(cx+(i+120)*sc,top-16*sc);g.stroke()}g.restore();ellipse(cx,top,33*sc,10*sc,'#e1a25e');ellipse(cx,top-2*sc,28*sc,7*sc,'#8b542c');
// cream built in an accumulating continuous spiral; ambient highlights give volume
let pts=cream.map(p=>({x:cx+p.x*sc,y:top-p.h*sc+p.z*sc}));if(pts.length){linePath(pts,'#b8a38a',20*sc);linePath(pts,'#e7d6bb',17*sc);linePath(pts,'#fff3d9',12*sc);linePath(pts,'#fff9e9',4*sc)}g.restore();
// connected falling ribbon from nozzle to tower, dynamically curves with movement
if(mode==='pour'&&cream.length){let end=pts[pts.length-1];const x0=W/2,y0=sy+22*sc;let ribbon=[{x:x0,y:y0}];for(let j=1;j<=14;j++){let u=j/14;let ease=u*u*(3-2*u);ribbon.push({x:x0+(end.x-x0)*ease+Math.sin(u*2.7+now*2)*3*sc*u,y:y0+(end.y-y0)*u})}linePath(ribbon,'#bbab95',20*sc);linePath(ribbon,'#efe1c8',16*sc);linePath(ribbon,'#fff6e2',10*sc);linePath(ribbon,'#fffdf1',3*sc)}
}
function frame(ts){let dt=Math.min(.05,(ts-last)/1000||.016);last=ts;now+=dt;const prevX=cur.x;cur.x=smooth(cur.x,target.x,clamp(dt*9,0,1));cur.y=smooth(cur.y,target.y,clamp(dt*9,0,1));if(mode==='pour'){let age=now-start;const sc=scene().scale;let speed=2.0;let desired=age*speed;height=Math.min(24,desired);let rad=clamp(17+Math.cos(age*7)*10,5,27);if(now>=nextDot){cream.push({x:Math.sin(age*11)*rad+cur.x*16,z:Math.cos(age*11)*6+cur.y*3,h:height*6.5});nextDot=now+.029;if(cream.length>850)cream.shift()}// disproportionate sideways movement or unsupported towers collapse
let stack=cream.slice(-100);let mean=stack.reduce((a,p)=>a+p.x,0)/(stack.length||1);let instability=Math.abs(mean+cur.x*12);if(height>19.3||height>9&&instability>43||height>13&&Math.abs(cur.x-prevX)/Math.max(dt,.016)>18)stop();$('#height').textContent=height.toFixed(1)+' cm'}else if(mode==='fall'){fallT+=dt;tilt+=dt*2.2;if(fallT>.9)finish()}paint();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
})();</script></body></html>
