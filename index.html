<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff4e7"><title>Soft Serve Studio 🍦</title><style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap');
:root{font-family:Tajawal,system-ui,-apple-system,sans-serif;color:#6d4536}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#f9ead8}#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;inset:0;pointer-events:none}header{position:absolute;top:max(15px,env(safe-area-inset-top));right:18px;left:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-size:clamp(21px,5vw,32px);font-weight:800;letter-spacing:-1px;text-shadow:0 2px #fff9}.brand small{display:block;font-size:12px;font-weight:700;letter-spacing:1.5px;color:#b48d78}.chip{background:#fffcf3db;border:1px solid #ffffffb9;border-radius:20px;padding:10px 15px;box-shadow:0 7px 24px #8b5a3022;text-align:center;min-width:81px}.chip b{display:block;font-size:21px}.chip span{font-size:11px;font-weight:800;color:#987360}.center{position:absolute;left:50%;transform:translateX(-50%);top:13%;width:80%;text-align:center;font-weight:800;font-size:16px;color:#8c6455;transition:opacity .3s}#hint{bottom:155px;top:auto;max-width:360px;background:#fff9;border-radius:18px;padding:10px 12px;font-size:14px;box-shadow:0 4px 18px #6c4d2a18}.actions{position:absolute;bottom:max(23px,env(safe-area-inset-bottom));left:18px;right:18px;display:flex;justify-content:center;align-items:center;gap:14px;pointer-events:auto}.btn{font-family:inherit;border:0;border-radius:23px;padding:17px 20px;min-height:60px;box-shadow:0 8px 0 #9f5b67,0 13px 25px #553f351f;font-size:18px;font-weight:800;color:white;background:#e58a9a;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}.btn:active,.btn.pressed{transform:translateY(5px);box-shadow:0 3px 0 #9f5b67,0 7px 20px #553f351f}.btn.alt{background:#fff9ee;color:#9c6b52;box-shadow:0 7px 0 #ddc8ac,0 10px 20px #553f351c;font-size:16px}.btn.alt:active{box-shadow:0 2px 0 #ddc8ac}.btn.pour{width:min(54vw,245px);background:#de7e8c;box-shad </style></head><body><canvas id="game"></canvas><div id="hud"><header><div class="brand">SOFT SERVE <small>ICE CREAM STUDIO</small></div><div class="chip"><span>أفضل نتيجة</span><b id="best">0</b></div></header><div id="progress"><div id="fill"></div></div><div id="flavor">🍦 فانيلا كريمية</div><div class="center" id="hint">↔️ حرّك القمع ليبدأ الصب تلقائيًا، ثم شكّل الآيسكريم</div><button id="sound" class="sound" aria-label="Toggle sound">🔊</button><div class="actions"><button id="reset" class="btn alt">↻ إعادة</button><button id="finish" class="btn alt">✓ إنهاء</button></div><div id="foot">Fan-made original recreation · لا يرتبط بصاحب الموقع الأصلي</div><div id="result" class="overlay"><div class="modal"><div class="emoji">🍦</div><h2>يا سلام!</h2><div id="stars" class="stars">⭐⭐⭐</div><p id="message"></p><button class="btn" id="again">العب مرة ثانية</button></div></div></div><script>
(()=>{'use strict';const c=document.querySelector('#game'),ctx=c.getContext('2d',{alpha:false}),$=s=>document.querySelector(s);const TAU=Math.PI*2;let W=0,H=0,DPR=1,level=0,px=0,tx=0,pressed=false,dragging=false,last=0,done=false,sound=true;const maxLength=520;let cream=[],used=0,score=0,coneTilt=0,glitters=[],t=0;let audio;const palettes=[{name:'فانيلا كريمية',base:'#ffedca',mid:'#fff5dd',shadow:'#cfab82'},{name:'فراولة',base:'#f6adc6',mid:'#ffe1e9',shadow:'#c76c8d'},{name:'شوكولاتة',base:'#9e6950',mid:'#ca9878',shadow:'#643d30'},{name:'فستق',base:'#badba7',mid:'#e1edca',shadow:'#7d9b70'}];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*f;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function ell(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill()}
function path(points,color,width,shadow=0){if(points.length<2)return;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length-1;i++){let midX=(points[i].x+points[i+1].x)/2,midY=(points[i].y+points[i+1].y)/2;ctx.quadraticCurveTo(points[i].x,points[i].y,midX,midY)}let p=points.at(-1);ctx.lineTo(p.x,p.y);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowBlur=shadow;ctx.shadowColor=color;ctx.stroke();ctx.shadowBlur=0}
function reset(next=false){if(next)level=(level+1)%palettes.length;cream=[];used=0;px=0;tx=0;pressed=false;done=false;score=0;glitters=[];$('#result').classList.remove('show');$('#fill').style.width='0%';$('#flavor').textContent='🍦 '+palettes[level].name;$('#hint').style.opacity=1;$('#best').textContent=localStorage.getItem('softserve-best')||0}
function bell(freq=440,seconds=.09,type='sine',gain=.025){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let osc=audio.createOscillator(),g=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+seconds);osc.connect(g);g.connect(audio.destination);osc.start();osc.stop(audio.currentTime+seconds)}catch{}}
function target(v){tx=clamp(v,-1.05,1.05)}let pointer=null;c.addEventListener('pointerdown',e=>{if(done)return;dragging=true;pointer=e.pointerId;c.setPointerCapture(e.pointerId);target((e.clientX-W/2)/(Math.min(W*.3,140)));});c.addEventListener('pointermove',e=>{if(dragging&&e.pointerId===pointer){const previous=tx;target((e.clientX-W/2)/(Math.min(W*.3,140)));if(!pressed&&Math.abs(tx-previous)>.007){pressed=true;bell(320,.09,'triangle',.012)}}});const up=e=>{if(e.pointerId===pointer){dragging=false;pointer=null}};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
$('#reset').onclick=()=>{bell(530);reset()};$('#finish').onclick=()=>finish();$('#again').onclick=()=>{bell(550);reset(true)};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊':'🔇'};
addEventListener('keydown',e=>{if(e.code==='Space'&& !done){e.preventDefault();pressed=true}if(e.key==='ArrowLeft')target(tx-.14);if(e.key==='ArrowRight')target(tx+.14);if(e.key==='Enter'&&!done)finish()});addEventListener('keyup',e=>{});
function finish(){if(done)return;done=true;stop();const total=cream.length;if(!total){done=false;bell(150,.18,'sawtooth');return}let closeness=0,positions={};for(let i=0;i<total;i++){let p=cream[i],angle=Math.atan2(p.z,p.x),ring=Math.round(p.y/15);(positions[ring]??=[]).push(Math.sqrt(p.x*p.x+p.z*p.z));}let vals=Object.values(positions).map(a=>a.reduce((v,n)=>v+n,0)/a.length),spread=vals.length?vals.reduce((a,v)=>a+Math.abs(v-24),0)/vals.length:35;closeness=clamp(1-spread/45,0,1);score=Math.round(Math.min(100,closeness*75+Math.min(25,used/maxLength*25)));let best=Math.max(score,Number(localStorage.getItem('softserve-best')||0));localStorage.setItem('softserve-best',best);$('#best').textContent=best;$('#stars').textContent=score>=80?'⭐⭐⭐':score>=48?'⭐⭐':'⭐';$('#message').innerHTML='نتيجتك <b style="font-size:27px">'+score+'/100</b><br>'+ (score>=80?'لفّة احترافية! صرت ملك الآيسكريم 👑':score>=48?'حلوة! حاول تلف بشكل أهدى 🍦':'جرّب تحريك القمع بشكل دائري ومنتظم ✨');$('#result').classList.add('show');for(let i=0;i<50;i++)glitters.push({x:Math.random()*W,y:-Math.random()*H,s:2+Math.random()*5,v:1+Math.random()*3,h:Math.random()*360});bell(700,.17);setTimeout(()=>bell(925,.2),130)}
function frame(ts){let dt=Math.min(.045,(ts-last)/1000||.016);last=ts;t+=dt;px=lerp(px,tx,clamp(dt*12,0,1));coneTilt=lerp(coneTilt,(tx-px)*.25,.1);if(pressed&&!done){used+=dt*62;let n=3;for(let j=0;j<n;j++){const u=used+j/n,ang=u*.135,ideal= Math.max(7,34-u*.027);let dx=px*42;let radial= Math.abs(dx)>ideal?ideal:Math.abs(dx);cream.push({x:dx+(Math.sin(ang)*3),z:Math.cos(ang)*radial*.55,y:u*.27,seed:Math.random()});if(cream.length>1800)cream.shift()}$('#fill').style.width=Math.min(100,used/maxLength*100)+'%';$('#hint').style.opacity=0;if(used>=maxLength)finish()}
render();requestAnimationFrame(frame)}
function render(){const m=Math.min(W/390,H/750,1.38),cx=W/2,baseY=H*.715,unit=m;const p=palettes[level];let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#fffaf0');bg.addColorStop(.65,'#fbeadb');bg.addColorStop(1,'#eac6b0');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// gently lit wall and tabletop
ctx.fillStyle='#f6e5d6';ctx.fillRect(0,H*.78,W,H*.22);ctx.strokeStyle='#e8ccbc';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H*.78);ctx.lineTo(W,H*.78);ctx.stroke();let grad=ctx.createRadialGradient(cx,baseY+54*unit,10,cx,baseY+54*unit,180*unit);grad.addColorStop(0,'#88615346');grad.addColorStop(1,'#88615300');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(cx,baseY+76*unit,155*unit,34*unit,0,0,TAU);ctx.fill();
// authentic-looking frozen dessert dispenser
const nozzleY=H*.24,nozzleX=cx;ctx.save();ctx.shadowColor='#6d42341c';ctx.shadowBlur=16;let metal=ctx.createLinearGradient(cx-69*unit,0,cx+69*unit,0);metal.addColorStop(0,'#a9b0b1');metal.addColorStop(.2,'#fcfcfa');metal.addColorStop(.55,'#d9dedc');metal.addColorStop(1,'#889092');roundRect(cx-80*unit,-21*unit,160*unit,nozzleY+3*unit,19*unit,metal);ctx.restore();roundRect(cx-64*unit,35*unit,128*unit,40*unit,8*unit,'#f5f3ef');roundRect(cx-51*unit,45*unit,102*unit,18*unit,4*unit,'#c97583');ctx.fillStyle='#fff6ec';ctx.font=`800 ${12*unit}px sans-serif`;ctx.textAlign='center';ctx.fillText('SOFT SERVE',cx,58*unit);roundRect(cx-28*unit,nozzleY-6*unit,56*unit,38*unit,8*unit,metal);roundRect(cx-17*unit,nozzleY+22*unit,34*unit,28*unit,5*unit,'#b1b6b6');ell(cx,nozzleY+50*unit,16*unit,7*unit,'#767c7d');ell(cx,nozzleY+47*unit,11*unit,4*unit,'#525655');
// plate beneath cone
ell(cx+px*46*unit,baseY+58*unit,88*unit,18*unit,'#a3775c30');ell(cx+px*46*unit,baseY+52*unit,75*unit,12*unit,'#fffaf2');
const coneX=cx+px*46*unit,coneTop=baseY-22*unit,coneEnd=baseY+99*unit,coneW=46*unit;
ctx.save();ctx.translate(coneX,coneTop);ctx.rotate(coneTilt);let waffle=ctx.createLinearGradient(-coneW,0,coneW,0);waffle.addColorStop(0,'#b66f38');waffle.addColorStop(.25,'#e6ac66');waffle.addColorStop(.6,'#f7cb86');waffle.addColorStop(1,'#be7b42');ctx.beginPath();ctx.moveTo(-coneW,0);ctx.quadraticCurveTo(0,10*unit,coneW,0);ctx.lineTo(0,coneEnd-coneTop);ctx.closePath();ctx.fillStyle=waffle;ctx.fill();ctx.save();ctx.clip();ctx.strokeStyle='#b87c43a1';ctx.lineWidth=2*unit;for(let k=-200;k<200;k+=15){ctx.beginPath();ctx.moveTo(k*unit,-25*unit);ctx.lineTo((k+180)*unit,150*unit);ctx.stroke();ctx.beginPath();ctx.moveTo(k*unit,145*unit);ctx.lineTo((k+180)*unit,-25*unit);ctx.stroke()}ctx.restore();ell(0,2*unit,coneW,13*unit,'#e9b97f');ell(0,-3*unit,coneW-5*unit,9*unit,'#b57844');ctx.restore();
// ice cream laid in rings: projector offsets make the swirls feel 3d
const r=cream.length?cream.at(-1).y:0;let pts=[];for(let i=0;i<cream.length;i++){let a=cream[i],layer=a.y;const zShift=a.z*.37;pts.push({x:coneX+a.x*unit,y:coneTop-10*unit-layer*unit+zShift*unit})}
const w=clamp(21*unit,10,29);ctx.save();ctx.shadowColor='#71452a48';ctx.shadowBlur=7*unit;ctx.shadowOffsetY=3*unit;path(pts,p.shadow,w+5*unit);ctx.restore();path(pts,p.base,w);path(pts,p.mid,w*.62);path(pts,'#ffffff55',w*.16);
if(pressed&&!done){const yy=coneTop-10*unit-r*unit;let xx=coneX+(cream.at(-1)?.x||0)*unit;let stripe=ctx.createLinearGradient(cx-13*unit,0,cx+13*unit,0);stripe.addColorStop(0,p.shadow);stripe.addColorStop(.45,p.mid);stripe.addColorStop(1,p.base);roundRect(cx-11*unit,nozzleY+45*unit,22*unit,Math.max(0,yy-(nozzleY+43*unit)),9*unit,stripe);ell(xx,yy,10*unit,6*unit,p.mid)}
// decorative side objects
ctx.save();ctx.globalAlpha=.46;ell(cx-135*unit,baseY+63*unit,23*unit,8*unit,'#e4a4aa');ell(cx+138*unit,baseY+70*unit,31*unit,9*unit,'#e5ad7f');ctx.restore();if(done){glitters.forEach(a=>{a.y+=a.v;ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.h*.02);ctx.fillStyle=['#ed879b','#ffd77f','#fff','#b3caab'][Math.floor(a.h)%4];ctx.fillRect(-a.s/2,-a.s/2,a.s,a.s);ctx.restore()})}
}
reset();requestAnimationFrame(frame);
})();
